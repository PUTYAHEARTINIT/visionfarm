<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionFarm Portal - Admin Upload</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', -apple-system, sans-serif;
  background: #050507;
  color: #e8e6e1;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 600px;
  width: 90%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 48px;
}

.logo {
  text-align: center;
  margin-bottom: 32px;
}

.logo img {
  height: 60px;
  opacity: 0.9;
}

h1 {
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 8px;
  color: #c9a55c;
  letter-spacing: -0.5px;
}

.subtitle {
  font-size: 14px;
  color: rgba(232,230,225,0.5);
  margin-bottom: 32px;
}

.form-group {
  margin-bottom: 24px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: rgba(232,230,225,0.7);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

input[type="text"],
input[type="password"],
input[type="file"],
textarea {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: #e8e6e1;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s;
}

input[type="text"]:focus,
input[type="password"]:focus,
textarea:focus {
  outline: none;
  border-color: #c9a55c;
  background: rgba(255,255,255,0.08);
}

input[type="file"] {
  padding: 16px;
  cursor: pointer;
}

textarea {
  resize: vertical;
  min-height: 80px;
}

.btn {
  width: 100%;
  padding: 14px 24px;
  background: #c9a55c;
  color: #050507;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn:hover {
  background: #d4b06d;
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.uploaded-files {
  margin-top: 40px;
  padding-top: 40px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.file-item {
  background: rgba(255,255,255,0.03);
  padding: 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.file-name {
  font-weight: 500;
  color: #e8e6e1;
}

.file-link {
  font-size: 12px;
  color: #c9a55c;
  text-decoration: none;
}

.file-link:hover {
  text-decoration: underline;
}

#loginForm {
  display: block;
}

#uploadForm {
  display: none;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: rgba(232,230,225,0.5);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn.active {
  background: rgba(201,165,92,0.12);
  color: #c9a55c;
}

#websiteForm {
  display: none;
}

.alert {
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 20px;
  font-size: 14px;
}

.alert-success {
  background: rgba(76, 175, 80, 0.1);
  border: 1px solid rgba(76, 175, 80, 0.3);
  color: #81c784;
}

.alert-error {
  background: rgba(244, 67, 54, 0.1);
  border: 1px solid rgba(244, 67, 54, 0.3);
  color: #e57373;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="logo-nav.png" alt="VisionFarm">
  </div>

  <!-- Login Form -->
  <div id="loginForm">
    <h1>Admin Portal</h1>
    <p class="subtitle">Enter password to access document upload</p>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="Enter admin password">
    </div>

    <button class="btn" onclick="login()">Access Portal</button>
  </div>

  <!-- Upload Form (hidden until login) -->
  <div id="uploadForm">
    <h1>Share With a Client</h1>
    <p class="subtitle">Send a watermarked document, or a live pitch site, as one VisionFarm link</p>

    <div class="tabs">
      <button class="tab-btn active" id="tabBtnDoc" onclick="showTab('doc')">📄 Document</button>
      <button class="tab-btn" id="tabBtnSite" onclick="showTab('site')">🌐 Website</button>
    </div>

    <div id="alertContainer"></div>

    <div id="documentForm">
      <div class="form-group">
        <label>Client Name (for watermark)</label>
        <input type="text" id="clientName" placeholder="e.g., Acme Corp">
      </div>

      <div class="form-group">
        <label>Document Title</label>
        <input type="text" id="docTitle" placeholder="e.g., Q1 Strategy Proposal">
      </div>

      <div class="form-group">
        <label>Description (optional)</label>
        <textarea id="docDescription" placeholder="Brief description of the document..."></textarea>
      </div>

      <div class="form-group">
        <label>View Password <span style="opacity:0.45;font-weight:400;font-size:11px;letter-spacing:1px">(OPTIONAL — leave blank for open access)</span></label>
        <input type="password" id="docPassword" placeholder="Set a password for the recipient...">
      </div>

      <div class="form-group">
        <label>Upload Document (PDF or Image)</label>
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" onchange="handleFileSelect()">
      </div>

      <button class="btn" id="uploadBtn" onclick="uploadDocument()" disabled>Upload & Generate Link</button>
    </div>

    <div id="websiteForm">
      <div class="form-group">
        <label>Client Name</label>
        <input type="text" id="siteClientName" placeholder="e.g., La Fritanga">
      </div>

      <div class="form-group">
        <label>Site / Pitch Title</label>
        <input type="text" id="siteTitle" placeholder="e.g., La Fritanga — Website Pitch">
      </div>

      <div class="form-group">
        <label>Description (optional)</label>
        <textarea id="siteDescription" placeholder="Brief description of what this is..."></textarea>
      </div>

      <div class="form-group">
        <label>Live Site URL</label>
        <input type="text" id="siteUrl" placeholder="https://la-fritanga-pitch.vercel.app">
      </div>

      <div class="form-group">
        <label>Custom Link <span style="opacity:0.45;font-weight:400;font-size:11px;letter-spacing:1px">(OPTIONAL — e.g. "la-fritanga" → visionfarm.tech/view?id=la-fritanga)</span></label>
        <input type="text" id="siteSlug" placeholder="la-fritanga">
      </div>

      <div class="form-group">
        <label>Price <span style="opacity:0.45;font-weight:400;font-size:11px;letter-spacing:1px">(OPTIONAL — shown as "This site: $X" at the top of the pitch)</span></label>
        <input type="text" id="sitePrice" placeholder="$1,000">
      </div>

      <div class="form-group">
        <label>Other Services to Offer <span style="opacity:0.45;font-weight:400;font-size:11px;letter-spacing:1px">(OPTIONAL — one per line)</span></label>
        <textarea id="siteServices" placeholder="Menu Design Package&#10;Product Photography&#10;Customer Subscription Model&#10;Rewards Program&#10;Local SEO&#10;Paid Ads Management"></textarea>
      </div>

      <div class="form-group">
        <label>View Password <span style="opacity:0.45;font-weight:400;font-size:11px;letter-spacing:1px">(OPTIONAL — leave blank for open access)</span></label>
        <input type="password" id="sitePassword" placeholder="Set a password for the recipient...">
      </div>

      <button class="btn" id="shareBtn" onclick="shareWebsite()">Create Share Link</button>
    </div>

    <div class="uploaded-files" id="uploadedFiles" style="display: none;">
      <h2 style="font-size: 18px; margin-bottom: 16px;">Recent Shares</h2>
      <div id="filesList"></div>
    </div>
  </div>
</div>

<script>
// Simple password auth (upgrade to real auth later)
const ADMIN_PASSWORD = 'visionfarm2026';

function login() {
  const password = document.getElementById('adminPassword').value;
  if (password === ADMIN_PASSWORD) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('uploadForm').style.display = 'block';
    loadUploadedFiles();
  } else {
    alert('Incorrect password');
  }
}

function showTab(tab) {
  const isDoc = tab === 'doc';
  document.getElementById('documentForm').style.display = isDoc ? 'block' : 'none';
  document.getElementById('websiteForm').style.display = isDoc ? 'none' : 'block';
  document.getElementById('tabBtnDoc').classList.toggle('active', isDoc);
  document.getElementById('tabBtnSite').classList.toggle('active', !isDoc);
  document.getElementById('alertContainer').innerHTML = '';
}

async function shareWebsite() {
  const clientName = document.getElementById('siteClientName').value.trim();
  const docTitle = document.getElementById('siteTitle').value.trim();
  const description = document.getElementById('siteDescription').value.trim();
  const siteUrl = document.getElementById('siteUrl').value.trim();
  const slug = document.getElementById('siteSlug').value.trim();
  const price = document.getElementById('sitePrice').value.trim();
  const services = document.getElementById('siteServices').value.split('\n').map(s => s.trim()).filter(Boolean);
  const password = document.getElementById('sitePassword').value.trim();

  if (!clientName || !docTitle || !siteUrl) {
    showAlert('Please fill in client name, title, and site URL', 'error');
    return;
  }
  if (!/^https?:\/\//i.test(siteUrl)) {
    showAlert('Site URL needs to start with http:// or https://', 'error');
    return;
  }

  const shareBtn = document.getElementById('shareBtn');
  shareBtn.disabled = true;
  shareBtn.textContent = 'Creating link...';

  try {
    const response = await fetch('/api/share-site', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ clientName, docTitle, description, siteUrl, slug, price, services, password }),
    });
    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.error || 'Failed to create share link');

    saveUpload(result.document);
    showAlert(`✅ Link ready${password ? ' 🔒 (password protected)' : ''}: ${result.document.link}`, 'success');

    document.getElementById('siteClientName').value = '';
    document.getElementById('siteTitle').value = '';
    document.getElementById('siteDescription').value = '';
    document.getElementById('siteUrl').value = '';
    document.getElementById('siteSlug').value = '';
    document.getElementById('sitePrice').value = '';
    document.getElementById('siteServices').value = '';
    document.getElementById('sitePassword').value = '';

    loadUploadedFiles();
  } catch (error) {
    console.error('Share-site error:', error);
    showAlert(`❌ ${error.message}`, 'error');
  } finally {
    shareBtn.disabled = false;
    shareBtn.textContent = 'Create Share Link';
  }
}

function handleFileSelect() {
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  uploadBtn.disabled = !fileInput.files.length;
}

function showAlert(message, type = 'success') {
  const container = document.getElementById('alertContainer');
  container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  setTimeout(() => container.innerHTML = '', 5000);
}

async function uploadDocument() {
  const clientName = document.getElementById('clientName').value.trim();
  const docTitle = document.getElementById('docTitle').value.trim();
  const docDescription = document.getElementById('docDescription').value.trim();
  const docPassword = document.getElementById('docPassword').value.trim();
  const fileInput = document.getElementById('fileInput');

  if (!clientName || !docTitle || !fileInput.files.length) {
    showAlert('Please fill in all required fields', 'error');
    return;
  }

  const file = fileInput.files[0];
  const uploadBtn = document.getElementById('uploadBtn');

  // Enforce 50MB limit
  if (file.size > 50 * 1024 * 1024) {
    showAlert('❌ File too large. Maximum size is 50MB.', 'error');
    return;
  }

  // Disable button during upload
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Uploading file...';

  try {
    // ── Step 1: Get a client upload token from our API ──
    const tokenRes = await fetch('/api/upload-token', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: 'blob.generate-client-token', payload: { pathname: file.name, callbackUrl: `${location.origin}/api/upload-token`, multipart: false, clientPayload: null } })
    });
    const tokenData = await tokenRes.json();
    if (!tokenRes.ok || !tokenData.clientToken) throw new Error(tokenData.error || 'Could not get upload token');

    // ── Step 2: Upload file directly to Vercel Blob (bypasses function payload limit) ──
    uploadBtn.textContent = 'Uploading to storage...';
    const blobRes = await fetch(`https://blob.vercel-storage.com/${file.name}`, {
      method: 'PUT',
      headers: {
        'authorization': `Bearer ${tokenData.clientToken}`,
        'x-api-version': '7',
        'content-type': file.type,
      },
      body: file
    });
    if (!blobRes.ok) throw new Error(`Storage upload failed (${blobRes.status})`);
    const blobData = await blobRes.json();
    const blobUrl = blobData.url;

    // ── Step 3: Call watermark API with the blob URL ──
    uploadBtn.textContent = 'Watermarking...';
    const response = await fetch('/api/watermark', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ blobUrl, fileName: file.name, mimeType: file.type, clientName, docTitle, description: docDescription, password: docPassword })
    });

    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error(`Server error (${response.status})`);
    }

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || 'Watermark failed');
    }

    // Save to localStorage for quick access
    saveUpload(result.document);

    showAlert(`✅ Link ready${docPassword ? ' 🔒 (password protected)' : ''}: ${result.document.link}`, 'success');

    // Reset form
    document.getElementById('clientName').value = '';
    document.getElementById('docTitle').value = '';
    document.getElementById('docDescription').value = '';
    fileInput.value = '';

    loadUploadedFiles();

  } catch (error) {
    console.error('Upload error:', error);
    showAlert(`❌ Upload failed: ${error.message}`, 'error');
  } finally {
    uploadBtn.disabled = false;
    uploadBtn.textContent = 'Upload & Generate Link';
  }
}

function generateId() {
  return Math.random().toString(36).substring(2, 10);
}

function saveUpload(data) {
  const uploads = JSON.parse(localStorage.getItem('vf_uploads') || '[]');
  uploads.unshift(data);
  localStorage.setItem('vf_uploads', JSON.stringify(uploads));
}

function loadUploadedFiles() {
  const uploads = JSON.parse(localStorage.getItem('vf_uploads') || '[]');
  const container = document.getElementById('uploadedFiles');
  const list = document.getElementById('filesList');

  if (uploads.length === 0) {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  list.innerHTML = uploads.map(upload => `
    <div class="file-item">
      <div>
        <div class="file-name">${upload.docTitle}</div>
        <div style="font-size: 12px; color: rgba(232,230,225,0.5); margin-top: 4px;">
          ${upload.clientName} • ${new Date(upload.uploadDate).toLocaleDateString()}
        </div>
      </div>
      <a href="${upload.link}" class="file-link" target="_blank">View Link →</a>
    </div>
  `).join('');
}
</script>

</body>
</html>
