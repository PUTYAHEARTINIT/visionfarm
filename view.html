<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionFarm Document Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', -apple-system, sans-serif;
  background: #050507;
  color: #e8e6e1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 24px 5%;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo img {
  height: 40px;
  opacity: 0.9;
}

.download-btn {
  padding: 10px 20px;
  background: rgba(201,165,92,0.1);
  border: 1px solid #c9a55c;
  border-radius: 6px;
  color: #c9a55c;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-block;
}

.download-btn:hover {
  background: rgba(201,165,92,0.2);
  transform: translateY(-1px);
}

.container {
  flex: 1;
  max-width: 1200px;
  width: 90%;
  margin: 0 auto;
  padding: 48px 0;
}

.doc-header {
  text-align: center;
  margin-bottom: 40px;
}

.doc-title {
  font-size: 32px;
  font-weight: 500;
  color: #c9a55c;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.doc-meta {
  font-size: 14px;
  color: rgba(232,230,225,0.5);
}

.doc-description {
  font-size: 16px;
  color: rgba(232,230,225,0.7);
  margin-top: 16px;
  line-height: 1.6;
}

.about-band {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-bottom: 32px;
  padding: 24px 28px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
}

.about-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #c9a55c;
  margin-bottom: 8px;
  font-weight: 600;
}

.about-band p {
  font-size: 13.5px;
  line-height: 1.65;
  color: rgba(232,230,225,0.75);
}

@media (max-width: 768px) {
  .about-band { grid-template-columns: 1fr; }
}

.offer-band {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  background: rgba(201,165,92,0.06);
  border: 1px solid rgba(201,165,92,0.3);
  border-radius: 10px;
  padding: 22px 28px;
  margin-bottom: 32px;
}

.offer-price-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(232,230,225,0.5);
  margin-bottom: 4px;
}

.offer-price {
  font-size: 28px;
  font-weight: 600;
  color: #c9a55c;
  white-space: nowrap;
}

.offer-services {
  flex: 1;
  min-width: 220px;
}

.offer-services-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(232,230,225,0.5);
  margin-bottom: 10px;
}

.offer-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.offer-chip {
  font-size: 12.5px;
  color: rgba(232,230,225,0.85);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 99px;
  padding: 6px 14px;
}

.pricing-tiers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 32px;
}

.tier-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tier-card.featured {
  border-color: rgba(201,165,92,0.5);
  background: rgba(201,165,92,0.06);
}

.tier-card.revealed {
  border-color: rgba(201,165,92,0.6);
  background: rgba(201,165,92,0.08);
}

.tier-name {
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(232,230,225,0.6);
}

.tier-price {
  font-size: 30px;
  font-weight: 600;
  color: #c9a55c;
}

.tier-desc {
  font-size: 13px;
  color: rgba(232,230,225,0.7);
  line-height: 1.5;
  flex: 1;
}

.tier-btn {
  padding: 12px;
  background: rgba(201,165,92,0.1);
  border: 1px solid #c9a55c;
  border-radius: 6px;
  color: #c9a55c;
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}

.tier-btn:hover { background: rgba(201,165,92,0.2); }
.tier-btn:disabled { opacity: 0.5; cursor: default; }

.paid-banner {
  background: rgba(77,128,60,0.12);
  border: 1px solid #4d803c;
  border-radius: 8px;
  padding: 18px 24px;
  margin-bottom: 24px;
  text-align: center;
  color: #8fd47a;
}

.paid-banner strong { color: #a6e392; }

.preview-container {
  position: relative;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 32px;
}

.watermark-notice {
  background: rgba(201,165,92,0.1);
  border: 1px solid rgba(201,165,92,0.3);
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 24px;
  text-align: center;
}

.watermark-notice p {
  font-size: 14px;
  color: #c9a55c;
  margin-bottom: 4px;
}

.watermark-notice small {
  font-size: 12px;
  color: rgba(201,165,92,0.7);
}

#documentDisplay {
  position: relative;
  min-height: 600px;
  background: rgba(255,255,255,0.98);
  border-radius: 8px;
  overflow: hidden;
}

#pdfCanvas {
  width: 100%;
  display: block;
}

#imageDisplay {
  width: 100%;
  display: block;
  border-radius: 8px;
}

.watermark-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 10;
}

.watermark-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-45deg);
  font-size: 48px;
  font-weight: 700;
  color: rgba(201,165,92,0.15);
  text-transform: uppercase;
  letter-spacing: 4px;
  white-space: nowrap;
}

.footer {
  text-align: center;
  padding: 32px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 13px;
  color: rgba(232,230,225,0.4);
}

.error-message {
  text-align: center;
  padding: 80px 20px;
}

.error-message h2 {
  font-size: 24px;
  color: #e57373;
  margin-bottom: 12px;
}

.error-message p {
  font-size: 14px;
  color: rgba(232,230,225,0.5);
}

.loading {
  text-align: center;
  padding: 80px 20px;
  font-size: 16px;
  color: rgba(232,230,225,0.7);
}

.password-gate {
  text-align: center;
  padding: 80px 20px;
  max-width: 400px;
  margin: 0 auto;
}
.pw-lock { font-size: 48px; margin-bottom: 24px; }
.password-gate h2 {
  font-size: 26px; font-weight: 500; color: #c9a55c; margin-bottom: 10px;
}
.password-gate p {
  font-size: 14px; color: rgba(232,230,225,0.5); margin-bottom: 32px;
}
.pw-input {
  width: 100%; padding: 14px 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #e8e6e1; font-size: 15px;
  margin-bottom: 14px; outline: none; box-sizing: border-box;
  transition: border 0.2s;
}
.pw-input:focus { border-color: rgba(201,165,92,0.5); }
.pw-btn {
  width: 100%; padding: 14px;
  background: rgba(201,165,92,0.1); border: 1px solid #c9a55c;
  border-radius: 8px; color: #c9a55c; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer;
  transition: all 0.3s;
}
.pw-btn:hover { background: rgba(201,165,92,0.2); }
.pw-error {
  margin-top: 14px; font-size: 13px; color: #e57373;
}

@media (max-width: 768px) {
  .doc-title {
    font-size: 24px;
  }

  .watermark-text {
    font-size: 32px;
  }

  .header {
    flex-direction: column;
    gap: 16px;
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <img src="logo-nav.png" alt="VisionFarm">
  </div>
  <a href="#" class="download-btn" id="downloadBtn" style="display: none;">Request Full Document</a>
</div>

<div class="container">
  <div id="content">
    <div class="loading">Loading document preview...</div>
  </div>
</div>

<div class="footer">
  <p>VisionFarm — Where Vision Becomes Reality</p>
  <p id="footerNote" style="margin-top: 8px; font-size: 11px;">This is a watermarked preview. Contact us for the full document.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const docId = urlParams.get('id') || window.location.pathname.split('/').pop();
let currentDoc = null;

if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function loadDocument() {
  const content = document.getElementById('content');
  try {
    const uploads = JSON.parse(localStorage.getItem('vf_uploads') || '[]');
    let doc = uploads.find(u => u.id === docId);

    if (!doc) {
      const response = await fetch(`/api/documents?id=${docId}`);
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error('Document not found');
      doc = result.document;
    }

    currentDoc = doc;

    if (doc.passwordHash) {
      showPasswordGate();
    } else {
      renderDocument(doc);
    }

  } catch (error) {
    document.getElementById('content').innerHTML = `
      <div class="error-message">
        <h2>Document Not Found</h2>
        <p>The document you're looking for doesn't exist or has been removed.</p>
      </div>`;
  }
}

function showPasswordGate() {
  document.getElementById('content').innerHTML = `
    <div class="password-gate">
      <div class="pw-lock">🔒</div>
      <h2>Password Protected</h2>
      <p>This document requires a password to view.</p>
      <input class="pw-input" type="password" id="pwInput" placeholder="Enter password..." onkeydown="if(event.key==='Enter')checkPassword()">
      <button class="pw-btn" onclick="checkPassword()">Unlock Document</button>
      <div class="pw-error" id="pwError" style="display:none">Incorrect password. Try again.</div>
    </div>`;
  setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

async function checkPassword() {
  const entered = document.getElementById('pwInput').value;
  if (!entered) return;
  const hash = await sha256(entered);
  if (hash === currentDoc.passwordHash) {
    renderDocument(currentDoc);
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function renderDocument(doc) {
  const isWebsite = doc.type === 'website';
  const hasTiers = isWebsite && Array.isArray(doc.pricingTiers) && doc.pricingTiers.length > 0;
  const showPriceInBand = isWebsite && doc.price && !hasTiers;
  const showServices = isWebsite && doc.services && doc.services.length;
  const justPaid = urlParams.get('paid') === '1';

  document.getElementById('content').innerHTML = `
    ${justPaid ? `
    <div class="paid-banner">
      <strong>Payment received — thank you!</strong><br>
      We'll be in touch shortly to kick things off.
    </div>` : ''}
    <div class="doc-header">
      <h1 class="doc-title">${escapeHtml(doc.docTitle)}</h1>
      <div class="doc-meta">
        Prepared for ${escapeHtml(doc.clientName)} • ${new Date(doc.uploadDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}
      </div>
      ${doc.description ? `<p class="doc-description">${escapeHtml(doc.description)}</p>` : ''}
    </div>
    <div class="about-band">
      <div>
        <div class="about-label">Who We Are</div>
        <p>VisionFarm is a small creative-and-tech studio that builds real, working pitches instead of mockups — so you can see and use the finished thing before committing to anything. We handle the design, the build, and the launch, then help grow what comes after with photography, content, ads, and ongoing support.</p>
      </div>
      <div>
        <div class="about-label">What We Built for ${escapeHtml(doc.clientName)}</div>
        <p>${doc.description ? escapeHtml(doc.description) : `A working look at ${escapeHtml(doc.docTitle)}, built to show what's possible — reach out any time to talk through changes or next steps.`}</p>
      </div>
    </div>
    ${isWebsite ? '' : `
    <div class="watermark-notice">
      <p><strong>Watermarked Preview</strong></p>
      <small>This document has been watermarked with the VisionFarm logo at 25% opacity.</small>
    </div>`}
    <div class="preview-container">
      <div id="documentDisplay">
        ${isWebsite
          ? `<iframe src="${escapeAttr(doc.siteUrl)}" style="width:100%;height:82vh;min-height:560px;border:none;border-radius:8px;background:#fff;"></iframe>`
          : doc.fileName.toLowerCase().endsWith('.pdf')
            ? `<iframe src="${escapeAttr(doc.fileUrl)}" style="width:100%;height:800px;border:none;border-radius:8px;"></iframe>`
            : `<img src="${escapeAttr(doc.fileUrl)}" alt="${escapeHtml(doc.docTitle)}" style="width:100%;display:block;border-radius:8px;">`
        }
      </div>
    </div>
    ${(showPriceInBand || showServices) ? `
    <div class="offer-band">
      ${showPriceInBand ? `
      <div>
        <div class="offer-price-label">This site</div>
        <div class="offer-price">${escapeHtml(doc.price)}</div>
      </div>` : ''}
      ${showServices ? `
      <div class="offer-services">
        <div class="offer-services-label">We can also help with</div>
        <div class="offer-chips">
          ${doc.services.map(s => `<span class="offer-chip">${escapeHtml(s)}</span>`).join('')}
        </div>
      </div>` : ''}
    </div>` : ''}
    ${hasTiers ? `
    <div class="pricing-tiers">
      ${doc.pricingTiers.map((t, i) => `
      <div class="tier-card ${i === 1 ? 'featured' : ''}" data-tier="${i}" data-price="${Number(t.price)}">
        <div class="tier-name">${escapeHtml(t.name)}</div>
        <div class="tier-price" hidden>$${Number(t.price).toLocaleString()}</div>
        ${t.description ? `<div class="tier-desc">${escapeHtml(t.description)}</div>` : ''}
        <button class="tier-btn" onclick="revealTierPrice(${i})">View Pricing</button>
      </div>`).join('')}
    </div>` : ''}`;

  const footerNote = document.getElementById('footerNote');
  if (footerNote) {
    footerNote.textContent = isWebsite
      ? 'A live preview of the site above — open it full-screen with the button up top.'
      : 'This is a watermarked preview. Contact us for the full document.';
  }

  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.style.display = 'inline-block';

  if (isWebsite) {
    downloadBtn.textContent = 'Open Full Site ↗';
    downloadBtn.href = doc.siteUrl;
    downloadBtn.target = '_blank';
    downloadBtn.onclick = null;
  } else {
    downloadBtn.textContent = 'Request Full Document';
    downloadBtn.removeAttribute('href');
    downloadBtn.onclick = (e) => {
      e.preventDefault();
      alert('To request the full unwatermarked document, please contact VisionFarm at contact@visionfarm.tech');
    };
  }
}

function revealTierPrice(tierIndex) {
  const card = document.querySelector(`.tier-card[data-tier="${tierIndex}"]`);
  if (!card) return;
  card.classList.add('revealed');
  card.querySelector('.tier-price').hidden = false;
  const btn = card.querySelector('.tier-btn');
  const price = Number(card.dataset.price).toLocaleString();
  btn.textContent = `Choose This — $${price}`;
  btn.onclick = () => checkoutTier(tierIndex);
}

async function checkoutTier(tierIndex) {
  const btns = document.querySelectorAll('.tier-btn');
  btns.forEach(b => { b.disabled = true; });
  const clicked = event.target;
  const originalText = clicked.textContent;
  clicked.textContent = 'Starting checkout...';
  try {
    const response = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ docId, tierIndex }),
    });
    const result = await response.json();
    if (!response.ok || !result.success) throw new Error(result.error || 'Could not start checkout');
    window.location.href = result.url;
  } catch (error) {
    alert(error.message || 'Something went wrong starting checkout.');
    btns.forEach(b => { b.disabled = false; });
    clicked.textContent = originalText;
  }
}

function escapeAttr(text) {
  return String(text).replace(/"/g, '&quot;');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadDocument);
</script>

</body>
</html>
